<html>
<head>
<style>
table {
width:100%;
}
table, th, td {
border: 1px solid black;
border-collapse: collapse;
}
th, td {
padding: 15px;
text-align: left;
}
#t01 tr:nth-child(even) {
background-color: #eee;
}
#t01 tr:nth-child(odd) {
background-color: #fff;
}
#t01 th {
background-color: red;
color: white
}
</style>
</head>
<body>
<h2>Styling Tables</h2>
<table>
<tr>
<th>firstname</th>
<th>lastname</th>
<th>Age</th>
</tr>
<tr>
<td>Jay</td>
<td>Mevada</td>
<td>22</td>
</tr>
<tr>
<td>Rutvik</td>
<td>Mevada</td>
<td>18</td>
</tr>
<tr>
<td>Shivam</td>
<td>Mevada</td>
<td>28</td>
</tr>
</table>
<br>
<table id="t01">
<tr>

</table>
</body>
</html>
